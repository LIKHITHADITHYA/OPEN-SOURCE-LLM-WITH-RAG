[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-rag"
version = "0.1.0"
description = "A hybrid RAG system using NVIDIA Llama-3 and SerpApi"
authors = [{ name = "Senior AI Engineer", email = "engineer@example.com" }]
dependencies = [
    "openai",
    "langchain",
    "langchain-community",
    "gradio",
    "numpy",
    "requests",
    "python-dotenv",
    "google-search-results",
    "chromadb",
    "fastapi",
    "uvicorn",
    "pydantic"
]

[project.scripts]
nvidia-rag = "nvidia_rag.main:main"
nvidia-rag-api = "nvidia_rag.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

